name: cyberlab_mitm_lab

services:
  mitm-lab:
    build:
      context: ../common/edu_lab
      dockerfile: Dockerfile
    container_name: cyberlab_mitm_lab
    environment:
      SCENARIO_ID: S05
      LAB_MODE: mitm
      APP_TITLE: CyberLab - MITM simulado en tráfico no cifrado
    ports:
      - "127.0.0.1:${MITM_PORT:-8086}:5000"
    networks:
      - mitm_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # NUEVO: Contenedor atacante para ejecutar arpspoof, tcpdump (Prioridad 2)
  mitm-attacker:
    image: alpine:3.21
    container_name: mitm-attacker
    # Instalamos dsniff (incluye arpspoof) y tcpdump
    command: sh -c "apk add --no-cache dsniff tcpdump >/dev/null 2>&1; sleep infinity"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - mitm_net
    init: true

networks:
  mitm_net:
    driver: bridge