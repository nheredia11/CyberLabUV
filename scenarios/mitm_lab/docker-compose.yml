# S05 · MITM en tráfico no cifrado
# Laboratorio vulnerable + contenedor atacante. Aislamiento:
#  - mitm_net: red interna (sin salida a internet), compartida por lab y atacante.
#  - mitm_lab_edge: solo el laboratorio la usa para publicar su puerto en 127.0.0.1.
services:
  mitm-lab:
    build:
      context: ../common/edu_lab
      dockerfile: Dockerfile
    environment:
      SCENARIO_ID: S05
      LAB_MODE: mitm
      APP_TITLE: "CyberLab - MITM simulado en tráfico no cifrado"
    ports:
      - "127.0.0.1:${MITM_PORT:-8086}:5000"
    networks:
      mitm_net:
        aliases:
          - mitm-lab
      mitm_lab_edge: {}
    mem_limit: 256M
    cpus: "0.50"
    pids_limit: 100
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  mitm-attacker:
    build:
      context: ../common
      dockerfile: attacker/Dockerfile
    image: cyberlab-attacker:1
    user: root
    networks:
      - mitm_net
    depends_on:
      mitm-lab:
        condition: service_healthy
    mem_limit: 128M
    cpus: "0.25"
    pids_limit: 50
    read_only: true
    tmpfs:
      - /tmp
      - /home/student:uid=1000
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "which", "nmap"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  mitm_net:
    driver: bridge
    internal: true
  mitm_lab_edge:
    driver: bridge
