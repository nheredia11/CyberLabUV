# S02 · Autenticación HTTP
# Laboratorio vulnerable + contenedor atacante. Aislamiento:
#  - auth_http_net: red interna (sin salida a internet), compartida por lab y atacante.
#  - auth_http_edge: solo el laboratorio la usa para publicar su puerto en 127.0.0.1.
services:
  auth-lab:
    build:
      context: ../common/edu_lab
      dockerfile: Dockerfile
    environment:
      SCENARIO_ID: S02
      LAB_MODE: auth_http
      APP_TITLE: "CyberLab - Autenticación HTTP Vulnerable"
    ports:
      - "127.0.0.1:${AUTH_HTTP_PORT:-8081}:5000"
    networks:
      - auth_http_net
      - auth_http_edge
    mem_limit: 256M
    cpus: "0.50"
    pids_limit: 100
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  auth-attacker:
    build:
      context: ../common/attacker
    image: cyberlab-attacker:1
    user: root
    networks:
      - auth_http_net
    depends_on:
      auth-lab:
        condition: service_healthy
    mem_limit: 128M
    cpus: "0.25"
    pids_limit: 50
    read_only: true
    tmpfs:
      - /tmp
      - /home/student:uid=1000
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "which", "nmap"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  auth_http_net:
    driver: bridge
    internal: true
  auth_http_edge:
    driver: bridge
