name: cyberlab_auth_http

services:
  auth-lab:
    build:
      context: ../common/edu_lab
      dockerfile: Dockerfile
    container_name: cyberlab_auth_http_lab
    environment:
      SCENARIO_ID: S02
      LAB_MODE: auth_http
      APP_TITLE: CyberLab - Autenticación HTTP débil
      DEMO_USER: estudiante
      DEMO_PASSWORD: laboratorio123
      FLASK_ENV: production
    ports:
      - "127.0.0.1:${AUTH_HTTP_PORT:-8081}:5000"
    networks:
      - auth_lab_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  student-shell:
    image: alpine:3.21
    container_name: cyberlab_auth_http_shell
    command: ["sh", "-c", "sleep infinity"]
    tty: true
    stdin_open: true
    networks:
      - auth_lab_net

networks:
  auth_lab_net:
    driver: bridge