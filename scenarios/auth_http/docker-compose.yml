services:
  auth-lab:
    build:
      context: ../common/edu_lab
      dockerfile: Dockerfile
    environment:
      SCENARIO_ID: S02
      LAB_MODE: auth_http
      APP_TITLE: "CyberLab - Autenticación HTTP Vulnerable"
    ports:
      - "127.0.0.1:${AUTH_HTTP_PORT:-8081}:5000"
    networks:
      - auth_http_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  auth-attacker:
    image: alpine:3.21
    command: sh -c "apk add --no-cache nmap curl hydra && tail -f /dev/null"
    networks:
      - auth_http_net
    depends_on:
      - auth-lab
    restart: unless-stopped

networks:
  auth_http_net:
    driver: bridge