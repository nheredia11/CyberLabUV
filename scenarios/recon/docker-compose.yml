services:
  recon-lab:
    build:
      context: ../common/edu_lab
      dockerfile: Dockerfile
    environment:
      SCENARIO_ID: S01
      LAB_MODE: recon
      APP_TITLE: "CyberLab - Reconocimiento de Red y Servicios"
    ports:
      - "127.0.0.1:${RECON_PORT:-8083}:5000"
    networks:
      - recon_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  recon-attacker:
    image: alpine:3.21
    command: sh -c "apk add --no-cache nmap curl && tail -f /dev/null"
    networks:
      - recon_net
    depends_on:
      - recon-lab
    restart: unless-stopped

networks:
  recon_net:
    driver: bridge