# S04 · Autenticación SSH/FTP
# Laboratorio vulnerable + contenedor atacante. Aislamiento:
#  - auth_services_net: red interna (sin salida a internet), compartida por lab y atacante.
#  - auth_services_edge: solo el laboratorio la usa para publicar su puerto en 127.0.0.1.
services:
  auth_services-lab:
    build:
      context: ../common/edu_lab
      dockerfile: Dockerfile
    environment:
      SCENARIO_ID: S04
      LAB_MODE: auth_services
      APP_TITLE: "CyberLab - Servicios de Autenticación (SSH/FTP)"
    ports:
      - "127.0.0.1:${AUTH_SERVICES_PORT:-8085}:5000"
    networks:
      auth_services_net:
        aliases:
          - auth-services-lab
      auth_services_edge: {}
    mem_limit: 256M
    cpus: "0.50"
    pids_limit: 100
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  auth_services-attacker:
    build:
      context: ../common
      dockerfile: attacker/Dockerfile
    image: cyberlab-attacker:1
    user: root
    networks:
      - auth_services_net
    depends_on:
      auth_services-lab:
        condition: service_healthy
    mem_limit: 128M
    cpus: "0.25"
    pids_limit: 50
    read_only: true
    tmpfs:
      - /tmp
      - /home/student:uid=1000
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "which", "nmap"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  auth_services_net:
    driver: bridge
    internal: true
  auth_services_edge:
    driver: bridge
