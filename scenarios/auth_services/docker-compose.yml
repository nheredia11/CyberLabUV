services:
  auth_services-lab:
    build:
      context: ../common/edu_lab
      dockerfile: Dockerfile
    environment:
      SCENARIO_ID: S04
      LAB_MODE: auth_services
      APP_TITLE: "CyberLab - Servicios de Autenticación (SSH/FTP)"
    ports:
      - "127.0.0.1:${AUTH_SERVICES_PORT:-8085}:5000"
    networks:
      - auth_services_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  auth_services-attacker:
    image: alpine:3.21
    command: sh -c "apk add --no-cache nmap curl hydra openssh-client lftp && tail -f /dev/null"
    networks:
      - auth_services_net
    depends_on:
      - auth_services-lab
    restart: unless-stopped

networks:
  auth_services_net:
    driver: bridge