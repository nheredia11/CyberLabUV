name: cyberlab_smoke

services:
  ui-smoke:
    image: nginx:1.27-alpine
    container_name: cyberlab_smoke_ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    environment:
      APP_ENV: development
      PROJECT_NAME: CyberLab
    volumes:
      - ./landing:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cyberlab_smoke_net

  worker-smoke:
    image: alpine:3.21
    container_name: cyberlab_smoke_worker
    restart: unless-stopped
    init: true
    command: ["sh", "-c", "while true; do date >> /shared/heartbeat.log; sleep 30; done"]
    volumes:
      - shared_data:/shared
    networks:
      - cyberlab_smoke_net

networks:
  cyberlab_smoke_net:
    driver: bridge

volumes:
  shared_data: