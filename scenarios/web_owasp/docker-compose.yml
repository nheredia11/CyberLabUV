# S03 · Aplicación web vulnerable (OWASP)
# Laboratorio vulnerable + contenedor atacante. Aislamiento:
#  - web_owasp_net: red interna (sin salida a internet), compartida por lab y atacante.
#  - web_owasp_edge: solo el laboratorio la usa para publicar su puerto en 127.0.0.1.
services:
  web_owasp-lab:
    build:
      context: ../common/edu_lab
      dockerfile: Dockerfile
    environment:
      SCENARIO_ID: S03
      LAB_MODE: web_owasp
      APP_TITLE: "CyberLab - Aplicación Web Vulnerable (OWASP)"
    ports:
      - "127.0.0.1:${OWASP_PORT:-8084}:5000"
    networks:
      - web_owasp_net
      - web_owasp_edge
    mem_limit: 256M
    cpus: "0.50"
    pids_limit: 100
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web_owasp-attacker:
    build:
      context: ../common/attacker
    image: cyberlab-attacker:1
    user: root
    networks:
      - web_owasp_net
    depends_on:
      web_owasp-lab:
        condition: service_healthy
    mem_limit: 128M
    cpus: "0.25"
    pids_limit: 50
    read_only: true
    tmpfs:
      - /tmp
      - /home/student:uid=1000
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "which", "nmap"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  web_owasp_net:
    driver: bridge
    internal: true
  web_owasp_edge:
    driver: bridge
