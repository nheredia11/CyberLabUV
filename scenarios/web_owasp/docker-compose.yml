services:
  web_owasp-lab:
    build:
      context: ../common/edu_lab
      dockerfile: Dockerfile
    environment:
      SCENARIO_ID: S03
      LAB_MODE: web_owasp
      APP_TITLE: "CyberLab - Aplicación Web Vulnerable (OWASP)"
    ports:
      - "127.0.0.1:${OWASP_PORT:-8084}:5000"
    networks:
      - web_owasp_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    mem_limit: 256M
    cpus: '0.50'
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web_owasp-attacker:
    image: alpine:3.21
    command: sh -c "apk add --no-cache nmap curl bind-tools && tail -f /dev/null"
    networks:
      - web_owasp_net
    depends_on:
      - web_owasp-lab
    mem_limit: 128M
    cpus: '0.25'
    pids_limit: 50
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  web_owasp_net:
    driver: bridge