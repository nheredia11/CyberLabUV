name: cyberlab_web_owasp

services:
  web-owasp-lab:
    build:
      context: ../common/edu_lab
      dockerfile: Dockerfile
    container_name: cyberlab_web_owasp_lab
    environment:
      SCENARIO_ID: S03
      LAB_MODE: web_owasp
      APP_TITLE: CyberLab - Laboratorio web OWASP
    ports:
      - "127.0.0.1:${WEB_OWASP_PORT:-8084}:5000"
    networks:
      - web_owasp_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  web_owasp_net:
    driver: bridge