name: cyberlab_web_owasp

services:
  web-owasp-lab:
    build:
      context: ../common/edu_lab
      dockerfile: Dockerfile
    container_name: cyberlab_web_owasp_lab
    environment:
      SCENARIO_ID: S03
      LAB_MODE: web_owasp
      APP_TITLE: CyberLab - Inyección SQL y OWASP Top 10
    ports:
      - "127.0.0.1:${WEB_OWASP_PORT:-8083}:5000"
    networks:
      - owasp_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    restart: unless-stopped

  owasp-attacker:
    build:
      context: ../common/attacker
      dockerfile: Dockerfile
    container_name: cyberlab_web_owasp_attacker
    environment:
      TARGET_HOST: web-owasp-lab
    networks:
      - owasp_net
    depends_on:
      - web-owasp-lab
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    restart: unless-stopped

networks:
  owasp_net:
    driver: bridge