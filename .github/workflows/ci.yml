name: CyberLabUV Continuous Integration

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. PRUEBAS DE BACKEND (Python + Pytest)
  # ============================================================================
  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Ejecutar Pytest
        env:
          PYTHONPATH: backend
        run: |
          pytest tests/ -v --durations=10

  # ============================================================================
  # 2. PRUEBAS DE FRONTEND (Node.js + Build)
  # ============================================================================
  frontend-tests:
    name: Frontend Lint & Build Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar compilación del frontend
        run: npm run build

      - name: Ejecutar pruebas unitarias de React (si aplican)
        run: npm test -- --watchAll=false --passWithNoTests

  # ============================================================================
  # 3. SMOKE TEST CON DOCKER (Escenario S01 Recon)
  # ============================================================================
  docker-smoke-test:
    name: Docker Scenario Smoke Test (S01)
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Levantar Escenario S01 (Recon)
        run: |
          echo "=== Desplegando escenario S01 ==="
          docker compose -f scenarios/recon/docker-compose.yml up -d --build

      - name: Verificar estado de contenedores
        run: |
          echo "=== Estado de contenedores Docker ==="
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          
          # Verificar que al menos el contenedor objetivo esté en ejecución
          RUNNING_CONTAINERS=$(docker ps -q | wc -l)
          if [ "$RUNNING_CONTAINERS" -eq 0 ]; then
            echo "❌ Error: Ningún contenedor del escenario S01 está en ejecución."
            exit 1
          fi
          echo "✅ Smoke test exitoso: $RUNNING_CONTAINERS contenedores en ejecución."

      - name: Inspeccionar logs en caso de falla
        if: failure()
        run: |
          echo "=== Logs de contenedores ==="
          docker compose -f scenarios/recon/docker-compose.yml logs --tail=50

      - name: Limpiar escenario Docker
        if: always()
        run: |
          echo "=== Destruyendo escenario S01 ==="
          docker compose -f scenarios/recon/docker-compose.yml down -v --remove-orphans