services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyberlabuv-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      ENABLE_DEV_LOGIN: ${ENABLE_DEV_LOGIN:-false}
      ALLOW_SCENARIO_COMMANDS: ${ALLOW_SCENARIO_COMMANDS:-true}
      CYBERLAB_ROOT: /workspace
      CYBERLAB_DB: /workspace/data/cyberlabuv.sqlite3
      DATABASE_PATH: data/cyberlabuv.sqlite3
      TEACHER_EMAILS: ${TEACHER_EMAILS:-dev@uv.edu.co,docente@uv.edu.co}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-correounivalle.edu.co,univalle.edu.co,uv.edu.co}
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-2}
      MAX_SESSIONS_TOTAL: ${MAX_SESSIONS_TOTAL:-20}
      # El backend se conecta a la red de cada laboratorio para servirlo en /labs/<sesión>/
      BACKEND_CONTAINER: cyberlabuv-backend
      LAB_LINK_SECRET: ${LAB_LINK_SECRET:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    volumes:
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cyberlabuv-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0