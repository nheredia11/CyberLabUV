services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyberlabuv-backend
    environment:
      CYBERLAB_ROOT: /workspace
      CYBERLAB_DB: /workspace/data/cyberlabuv.sqlite3
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088
      ALLOW_SCENARIO_COMMANDS: "false"
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
  frontend:
    image: node:20-alpine
    container_name: cyberlabuv-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
