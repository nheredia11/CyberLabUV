services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyberlabuv-backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      CYBERLAB_ROOT: /workspace
      CYBERLAB_DB: /workspace/data/cyberlabuv.sqlite3
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ALLOWED_DOMAINS: correounivalle.edu.co,univalle.edu.co,uv.edu.co
    volumes:
      - ./:/workspace
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cyberlabuv-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0