id: S03
titulo: Aplicación web vulnerable para prácticas OWASP
orden: 3
descripcion: Escenario web controlado para estudiar de forma introductoria patrones asociados a inyección, XSS y Directory Traversal.
objetivos:
- Reconocer vulnerabilidades web comunes en una aplicación de laboratorio.
- Observar comportamientos inseguros asociados a entradas de usuario.
- Registrar evidencias sin afectar sistemas externos.
- Proponer controles básicos de validación, sanitización y autorización.
encuesta_obligatoria: true
checkpoints_obligatorios: true
comando_inicio: docker compose -f scenarios/web_owasp/docker-compose.yml up -d
