id: S01
titulo: Reconocimiento de red y servicios
orden: 1
descripcion: Escenario para identificar servicios expuestos dentro de una red Docker controlada y registrar hallazgos de forma académica.
objetivos:
- Comprender el propósito del reconocimiento en una práctica de ciberseguridad.
- Identificar servicios visibles dentro de un entorno local controlado.
- Registrar evidencias técnicas sin interactuar con sistemas externos.
- Relacionar el reconocimiento con controles preventivos y de monitoreo.
encuesta_obligatoria: true
checkpoints_obligatorios: true
comando_inicio: docker compose -f scenarios/recon/docker-compose.yml up -d
